services:
  cftest:
    image: ${CFTEST_IMAGE:-cftest:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cftest
    restart: unless-stopped
    # 与镜像内 cftest 用户一致；Linux 上若 ./data 属主不同，在 .env 里覆盖。
    user: "${CFWEB_UID:-10001}:${CFWEB_GID:-10001}"
    ports:
      # 默认只监听宿主机回环，避免把无认证的 WebUI 直接暴露到公网。
      # 需要从局域网访问时，在 .env 里设 CFWEB_BIND_IP=0.0.0.0（并收紧 CFWEB_ALLOW）。
      - "${CFWEB_BIND_IP:-127.0.0.1}:${CFWEB_PORT:-8787}:8787"
    env_file:
      - path: .env
        required: false
    environment:
      CFWEB_ADDR: 0.0.0.0:8787
      CFWEB_OPEN: "false"
      CFWEB_ROOT: /data
      # 默认仅允许局域网访问（回环 + 私有网段 + 本机网卡网段）。
      # 可用逗号分隔 CIDR 覆盖，例如 192.168.1.0/24；设为 any 放开（不推荐）。
      CFWEB_ALLOW: ${CFWEB_ALLOW:-lan}
    volumes:
      - ./data:/data
      - ./locations.json:/app/locations.json:ro
    cap_add:
      - NET_RAW
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # /api/health 不触发 mtr / sing-box 探测，避免 5s 超时误判 unhealthy
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # compose 的 healthcheck 会覆盖镜像 HEALTHCHECK，需显式保留启动宽限
      start_period: 15s
