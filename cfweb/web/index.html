<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cftest web</title>
<style>
:root {
  --bg: #f6f4ef;
  --card: #fff;
  --ink: #2c2c2a;
  --muted: #5f5e5a;
  --line: #d3d1c7;
  --blue: #185fa5;
  --blue-bg: #e6f1fb;
  --ok: #0f6e56;
  --warn: #854f0b;
  --err: #a32d2d;
  --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.5 var(--font); color: var(--ink); background: var(--bg); }
header { padding: 16px 24px 8px; }
h1 { margin: 0; font-size: 18px; font-weight: 600; }
.sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
.sub.offline { color: var(--err); }
.sub.insecure { color: var(--err); font-weight: 600; }
main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 0 24px 24px; }
@media (max-width: 960px) { main { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions { display: flex; gap: 8px; margin-top: 16px; }
button { border: 0; border-radius: 8px; padding: 9px 14px; font: inherit; cursor: pointer; }
.primary { background: var(--blue); color: #fff; }
.ghost { background: var(--blue-bg); color: var(--blue); }
.status { font-size: 12px; color: var(--muted); margin-top: 10px; word-break: break-all; }
.log { height: 280px; overflow: auto; background: #1e1e1c; color: #e8e6dc; font: 12px/1.45 var(--mono); padding: 12px; border-radius: 8px; white-space: pre-wrap; }
.hits { width: 100%; border-collapse: collapse; font-size: 12px; }
.hits th, .hits td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.hits th { color: var(--muted); font-weight: 500; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
.ok { background: #e1f5ee; color: var(--ok); }
.warn { background: #faeeda; color: var(--warn); }
.err { background: #fcebeb; color: var(--err); }
.files a { display: inline-block; margin: 0 8px 8px 0; color: var(--blue); }
.bar { height: 8px; background: #eceae4; border-radius: 999px; overflow: hidden; margin-top: 10px; }
.bar > div { height: 100%; width: 0; background: var(--blue); }
.progress-text { color: var(--muted); font-size: 12px; margin-top: 6px; }
details summary { cursor: pointer; color: var(--muted); margin-top: 12px; }
.copy { margin-left: 8px; padding: 2px 8px; background: var(--blue-bg); color: var(--blue); }
</style>
</head>
<body>
<header>
  <h1>cftest 本地控制台</h1>
  <div class="sub" id="meta">加载中…</div>
</header>
<main>
  <section class="card">
    <label>测速方式</label>
    <select id="speedmode">
      <option value="batch">批量评分：扫完再测全部</option>
      <option value="optimize">优选：找到达标地址即停</option>
      <option value="single">单 IP 测速：不扫描</option>
    </select>
    <div id="singlebox">
      <label>要测的 IP</label>
      <input id="singleip" placeholder="只在「单 IP 测速」时使用">
    </div>
    <label>cfdata 模式</label>
    <select id="mode">
      <option value="1">1 · 指定 colo 扫描</option>
      <option value="2">2 · 筛固定 colo</option>
      <option value="3">3 · 按国家筛</option>
    </select>
    <label>目标 colo / 国家</label>
    <input id="target" placeholder="HKG,NRT 或 HK,JP">
    <div class="row">
      <div><label>IP 类型</label>
        <select id="iptype"><option value="4">IPv4</option><option value="6">IPv6</option></select>
      </div>
      <div><label>每 colo 数量</label><input id="num" type="number" placeholder="8"></div>
    </div>
    <div class="row">
      <div><label>测速协议</label>
        <select id="protocol"><option value="http">HTTP</option><option value="https">HTTPS</option></select>
      </div>
      <div><label>测速大小 MB</label><input id="size" type="number" placeholder="50"></div>
    </div>
    <div class="row">
      <div><label>最低 Mbps（0 = 不限）</label><input id="speed" type="number" placeholder="50"></div>
      <div><label>最大延迟 ms（0 = 不限）</label><input id="latency" type="number" placeholder="200"></div>
    </div>
    <div class="row">
      <div><label>最大丢包率 %（0 = 不限）</label><input id="loss" type="number" placeholder="10"></div>
      <div><label>高跳数阈值（-1 = 关闭）</label><input id="hops" type="number" placeholder="16"></div>
    </div>
    <label>cfscan 路由关键字（逗号分隔，扫 NRT/SIN 可填 nrt,sin）</label>
    <input id="keywords" placeholder="hkg,tpe,tw,hk">
    <label><input id="detail" type="checkbox" checked> cfdata 详细延迟测试</label>
    <label><input id="skipscan" type="checkbox"> 跳过 cfscan（无 mtr 时自动勾选）</label>
    <label><input id="connect" type="checkbox"> 追加 cfconnectivity 复核</label>
    <label><input id="singbox" type="checkbox"> 经 sing-box 测 VMess+WS</label>
    <label>VMess UUID</label>
    <input id="uuid" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
    <label>WS Host</label>
    <input id="wshost" placeholder="your.domain.com">
    <label>SNI（留空 = 用环境变量 VMESS_SNI，再退回 WS Host）</label>
    <input id="sni" placeholder="留空则跟随 WS Host">
    <div class="row">
      <div><label>WS Path</label><input id="wspath" placeholder="/"></div>
      <div><label>端口</label><input id="vmessport" type="number" placeholder="443"></div>
    </div>
    <label><input id="vmesstls" type="checkbox" checked> TLS</label>
    <label><input id="allowinsecure" type="checkbox"> 允许无效证书（自签节点）</label>
    <div class="actions">
      <button class="primary" id="start" disabled>开始流水线</button>
      <button class="ghost" id="stop" disabled>停止</button>
    </div>
    <div class="status" id="status"></div>
  </section>
  <section>
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong>实时日志</strong>
        <span class="pill" id="busy">空闲</span>
      </div>
      <div class="bar" aria-hidden="true"><div id="bar"></div></div>
      <div class="progress-text" id="progress">等待开始</div>
      <div class="log" id="log"></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <strong>命中 / 测速结果</strong>
      <table class="hits"><thead><tr><th>阶段</th><th>IP</th><th>延迟</th><th>速度</th><th>信息</th><th></th></tr></thead><tbody id="hits"></tbody></table>
    </div>
    <div class="card">
      <strong>运行历史</strong>
      <div id="runs" class="files"></div>
      <div id="files" class="files"></div>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const logEl = $('log');
const hitsEl = $('hits');
const statusEl = $('status');
const busyEl = $('busy');
const metaEl = $('meta');
const startBtn = $('start');
const stopBtn = $('stop');
let defaultsApplied = false;
let uuidConfigured = false;
let busy = false;

function line(text) {
  logEl.textContent += text + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}

function clearUI() {
  logEl.textContent = '';
  hitsEl.replaceChildren();
  $('bar').style.width = '0';
  $('progress').textContent = '等待开始';
}

function updateProgress(e) {
  const done = Number(e.done || 0);
  const total = Number(e.total || 0);
  const pct = total > 0 ? Math.min(100, done / total * 100) : 0;
  $('bar').style.width = pct.toFixed(1) + '%';
  const hit = e.hit ? ' · 命中 ' + e.hit : '';
  const msg = e.message ? ' · ' + e.message : '';
  $('progress').textContent = (e.stage || '进度') + ' ' + done + '/' + total + hit + msg;
}

function addHit(e) {
  const extra = e.extra || {};
  const lat = extra.avg_latency_ms;
  const mbps = extra.download_mbps;
  const tr = document.createElement('tr');
  tr.dataset.mbps = mbps || 0;
  const cells = [
    e.stage || '',
    e.ip || '',
    lat ? lat + ' ms' : '',
    mbps ? Number(mbps).toFixed(1) + ' Mbps' : '',
    e.message || '',
  ];
  cells.forEach(text => {
    const td = document.createElement('td');
    td.textContent = text;
    tr.appendChild(td);
  });
  const action = document.createElement('td');
  if (e.ip) {
    const btn = document.createElement('button');
    btn.className = 'copy';
    btn.type = 'button';
    btn.textContent = '复制';
    btn.onclick = () => navigator.clipboard.writeText(e.ip).then(() => { btn.textContent = '已复制'; });
    action.appendChild(btn);
  }
  tr.appendChild(action);
  const rows = Array.from(hitsEl.children);
  const index = rows.findIndex(row => Number(row.dataset.mbps || 0) < Number(tr.dataset.mbps || 0));
  if (index === -1) hitsEl.appendChild(tr);
  else hitsEl.insertBefore(tr, rows[index]);
}

class ApiError extends Error {
  constructor(status, code, message, requestId) {
    super(message);
    this.status = status;
    this.code = code;
    this.requestId = requestId;
  }
}

const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

function setOnline(ok, detail) {
  if (ok) {
    busyEl.title = '';
    metaEl.classList.remove('offline');
    startBtn.disabled = !defaultsApplied || busy;
    stopBtn.disabled = !busy;
  } else {
    startBtn.disabled = true;
    stopBtn.disabled = true;
    metaEl.classList.add('offline');
    if (detail) metaEl.textContent = '服务不可达：' + detail + '（正在重试）';
  }
}

function setBusy(v) {
  busy = !!v;
  busyEl.textContent = busy ? '运行中' : '空闲';
  busyEl.className = 'pill ' + (busy ? 'warn' : 'ok');
  startBtn.disabled = !defaultsApplied || busy;
  stopBtn.disabled = !busy;
}

function showError(e) {
  if (e instanceof ApiError) {
    statusEl.textContent = e.message + (e.requestId ? '（请求 ID ' + e.requestId + '）' : '');
  } else if (e && e.name === 'AbortError') {
    statusEl.textContent = '请求超时，请检查服务是否繁忙';
  } else {
    statusEl.textContent = '无法连接服务：' + (e && e.message ? e.message : '未知错误');
  }
}

// 统一 API 客户端：超时、结构化错误、4xx 不重试、5xx/网络错误指数退避重试。
async function api(path, opts = {}, retries = 2) {
  let lastErr = null;
  for (let attempt = 0; attempt <= retries; attempt++) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), opts.timeout || 12000);
    try {
      const res = await fetch(path, Object.assign({}, opts, { signal: controller.signal }));
      clearTimeout(timer);
      let payload = null;
      const text = await res.text();
      if (text) { try { payload = JSON.parse(text); } catch (_) { payload = null; } }
      if (!res.ok) {
        const info = (payload && payload.error) || {};
        const err = new ApiError(res.status, info.code || 'http_error',
          info.message || ('HTTP ' + res.status), info.request_id || '');
        if (res.status < 500) { setOnline(true); throw err; } // 4xx 是调用方问题，重试没意义
        lastErr = err;
        // 5xx 说明服务端不可用，必须标记离线并禁用按钮，不能只记错误还显示在线。
        setOnline(false, err.message);
      } else {
        setOnline(true);
        return payload;
      }
    } catch (e) {
      clearTimeout(timer);
      if (e instanceof ApiError && e.status < 500) throw e;
      lastErr = e;
      setOnline(false, (e && e.message) || '连接失败');
    }
    if (attempt < retries) await sleep(400 * Math.pow(2, attempt));
  }
  throw lastErr || new Error('请求失败');
}

function applyDefaults(d, s) {
  if (!d) return;
  // <select> 天生有默认选中项，value 永远不为空，用「是否已套用过默认值」
  // 标记来判断，否则 dataMode / ipType 的下发会永远失效。
  const fill = (id, value) => {
    if (value === undefined || value === null) return;
    const el = $(id);
    if (el.dataset.defaulted === '1') return;
    el.value = String(value);
    el.dataset.defaulted = '1';
  };
  fill('mode', d.dataMode);
  fill('iptype', d.ipType);
  fill('target', d.target);
  fill('num', d.num);
  fill('speedmode', d.speedMode);
  fill('protocol', d.protocol);
  fill('size', d.size);
  fill('speed', d.speed);
  fill('loss', d.loss);
  fill('latency', d.latency);
  fill('hops', d.hops);
  fill('keywords', d.keywords);
  fill('wspath', d.path);
  fill('vmessport', d.port);
  if (d.host) $('wshost').value = d.host;
  uuidConfigured = !!d.uuidSet;
  if (uuidConfigured) $('uuid').placeholder = '服务端已配置，留空即可';
  $('sni').placeholder = d.sni ? ('留空 = ' + d.sni) : '留空则跟随 WS Host';
  $('vmesstls').checked = !!d.tls;
  $('allowinsecure').checked = !!d.allowInsecure;
  // 只在首次拉状态时自动勾选；否则每 4s 的轮询会把用户手动取消的勾选又勾回来。
  if (!s.mtr) $('skipscan').checked = true;
  if (s.singbox && d.host && (uuidConfigured || $('uuid').value)) $('singbox').checked = true;
  defaultsApplied = true;
}

async function refreshStatus() {
  const s = await api('/api/status', {}, 1);
  metaEl.textContent = `v${s.version} · ${s.goos} · 访问范围 ${s.allow} · ${s.root}`
    + (s.mtr ? ' · mtr 可用' : ' · mtr 不可用，建议跳过 cfscan')
    + (s.singbox ? ' · sing-box 可用' : ' · 未检测到 sing-box')
    + (s.insecure ? ' · ⚠ CFWEB_ALLOW=any：任何来源都可访问本控制台' : '');
  metaEl.classList.toggle('insecure', !!s.insecure);
  setBusy(s.busy);
  if (!defaultsApplied) {
    if (s.defaults) {
      applyDefaults(s.defaults, s);
      setBusy(s.busy); // 重新按 defaultsApplied 刷新按钮可用态
    } else {
      statusEl.textContent = '服务端未返回表单默认值，请刷新页面重试';
      return s;
    }
  }
  if (s.error) statusEl.textContent = s.error;
  else if (s.runDir) statusEl.textContent = '最近运行: ' + s.runDir;
  return s;
}

async function refreshRuns() {
  const names = await api('/api/runs', {}, 1) || [];
  const box = $('runs');
  box.replaceChildren();
  names.slice(0, 12).forEach(name => {
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = name;
    a.onclick = async (e) => {
      e.preventDefault();
      try {
        const files = await api('/api/files?run=' + encodeURIComponent(name), {}, 1) || [];
        const fbox = $('files');
        fbox.replaceChildren();
        files.forEach(file => {
          const fa = document.createElement('a');
          fa.href = '/api/files?run=' + encodeURIComponent(name) + '&file=' + encodeURIComponent(file);
          fa.textContent = file;
          fa.target = '_blank';
          fbox.appendChild(fa);
        });
      } catch (err) { showError(err); }
    };
    box.appendChild(a);
  });
}

function poll() {
  refreshStatus().catch(showError);
}

startBtn.onclick = async () => {
  const mode = $('mode').value;
  const target = $('target').value;
  if ($('speedmode').value === 'single' && !$('singleip').value.trim()) {
    statusEl.textContent = '单 IP 测速需要填写 IP';
    return;
  }
  if ($('singbox').checked) {
    const uuid = $('uuid').value.trim();
    const host = $('wshost').value.trim();
    if (!host) { statusEl.textContent = '启用 sing-box 时必须填写 WS Host'; return; }
    if (!uuid && !uuidConfigured) { statusEl.textContent = '启用 sing-box 时必须填写 UUID'; return; }
  }
  const body = {
    DataMode: mode,
    Colo: mode === '3' ? '' : target,
    Country: mode === '3' ? target : '',
    IPType: $('iptype').value,
    NumPerColo: Number($('num').value),
    Detail: $('detail').checked,
    SkipScan: $('skipscan').checked,
    RunConnect: $('connect').checked,
    SpeedMode: $('speedmode').value,
    SpeedProtocol: $('protocol').value,
    SingleIP: $('singleip').value.trim(),
    SpeedSize: Number($('size').value),
    SpeedMinMbps: Number($('speed').value),
    SpeedLoss: Number($('loss').value),
    SpeedLatency: Number($('latency').value),
    HighQualityHops: Number($('hops').value),
    ScanKeywords: $('keywords').value.trim(),
    UseSingBox: $('singbox').checked,
    VMessUUID: $('uuid').value.trim(),
    VMessHost: $('wshost').value.trim(),
    VMessSNI: $('sni').value.trim(),
    VMessPath: $('wspath').value,
    VMessPort: Number($('vmessport').value),
    VMessTLS: $('vmesstls').checked,
    VMessAllowInsecure: $('allowinsecure').checked,
  };
  startBtn.disabled = true;
  try {
    clearUI();
    await api('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    }, 0);
    statusEl.textContent = '已启动';
    setBusy(true);
    poll();
  } catch (err) {
    if (err instanceof ApiError && err.status === 409) {
      statusEl.textContent = '已有任务在跑，正在同步状态';
      refreshStatus().catch(showError);
      return;
    }
    showError(err);
    setBusy(false);
  }
};

stopBtn.onclick = async () => {
  stopBtn.disabled = true;
  try {
    await api('/api/stop', { method: 'POST' }, 0);
    statusEl.textContent = '已请求停止，等待当前探测退出…';
  } catch (err) {
    showError(err);
  }
  poll();
};

const es = new EventSource('/api/events');
// 每次连接（含断线自动重连）都先清空，再等服务器回放快照，避免重复
es.onopen = () => { clearUI(); setOnline(true); };
es.onerror = () => {
  setOnline(false, '实时日志连接中断');
  statusEl.textContent = '实时日志连接中断，浏览器会自动重连';
};
es.onmessage = (ev) => {
  let e;
  try { e = JSON.parse(ev.data); } catch (_) { return; }
  if (e.kind === 'reset') { clearUI(); return; }
  if (e.kind === 'progress') { updateProgress(e); return; }
  if (e.kind === 'progress_done') { $('bar').style.width = '100%'; }
  if (e.message) line((e.stage ? '[' + e.stage + '] ' : '') + e.message);
  if ((e.kind === 'hit' || e.kind === 'result') && e.ip) addHit(e);
  if (e.kind === 'done') { poll(); refreshRuns().catch(showError); }
};

poll();
refreshRuns().catch(showError);
// 页面隐藏时暂停轮询，回到前台立即同步一次，避免后台挂着一堆无效请求。
setInterval(() => { if (!document.hidden) poll(); }, 4000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
</script>
</body>
</html>
